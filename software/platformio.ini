; CENTAD firmware: one PlatformIO project, one folder per board.
;
;   pio run -e foc_mega            build ESP32 MKS FOC Mega bench rig
;   pio run -e pico                build Pico 2 W EMG node
;   pio run -e pico -t uploadfs    flash the web files in data/ (run scripts/build_pico_data.sh first)
;
; Each env compiles only its own folder under firmware/ via build_src_filter.
; Pins for each board live in firmware/<board>/pins.h: edit those, not the code.

[platformio]
src_dir = firmware
data_dir = data
default_envs = foc_mega, pico

; ---------------------------------------------------------------------------
; MKS ESP32 FOC Mega + GM4108H-120T, open-loop bench test.
; Platform / board / LEDC flag / lib are the hardware-verified config: do not change.
; Only build_src_filter was added so this env compiles firmware/foc_mega/ only.
; ---------------------------------------------------------------------------
[env:foc_mega]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/stable/platform-espressif32.zip
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters = send_on_enter
monitor_eol = LF
build_flags = -DSIMPLEFOC_ESP32_USELEDC   ; MCPWM output did NOT work on this board, LEDC does
lib_deps = askuric/Simple FOC
build_src_filter = -<*> +<foc_mega/> +<shared/>

; ---------------------------------------------------------------------------
; Raspberry Pi Pico 2 W + Seeed Grove EMG Detector -> Wi-Fi WebSocket.
; ---------------------------------------------------------------------------
[env:pico]
platform = https://github.com/maxgerhardt/platform-raspberrypi.git
board = rpipico2w
framework = arduino
board_build.core = earlephilhower
; 4 MB flash: 1 MB LittleFS for the served display + panel. Settings/calibration
; live in the separate EEPROM sector, so `uploadfs` never wipes calibration.
board_build.filesystem_size = 1m
; Upload over USB with picotool: reboots a running Pico into BOOTSEL itself,
; so BOOTSEL only needs holding for the very first flash.
upload_protocol = picotool
monitor_speed = 115200
build_src_filter = -<*> +<pico/> +<shared/>
build_flags =
	-Wall
	-std=gnu++17
	-O2
lib_deps =
	links2004/WebSockets@^2.6.1
	bblanchon/ArduinoJson@^7.2.0
